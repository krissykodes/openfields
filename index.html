<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openfields.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <video
          class="hero-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          aria-hidden="true"
        >
          <source src="./cornfieldharvest.mp4" type="video/mp4" />
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h1>Machine Intelligence for the World&rsquo;s Farmland</h1>
          <div class="hero-actions">
            <a class="btn btn-dark" href="#waitlist">Join the Waitlist</a>
          </div>
        </div>
      </section>

      <section class="mission">
        <div class="content-wrap">
          <h2>
            We&rsquo;re farmers, engineers, and research scientists building open,
            field-level intelligence that brings earlier clarity to yields and acres.
          </h2>
          <hr />
          <div id="data" class="data-block">
            <a
              class="map-card"
              href="https://your-vercel-data-page.vercel.app"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open interactive data page"
            >
              <img
                class="map-preview"
                src="./lyon-county-map.png"
                alt="Lyon County, Iowa crop map visualization"
              />
            </a>
          </div>
        </div>
      </section>

      <section id="waitlist" class="waitlist">
        <div class="waitlist-overlay"></div>
        <div class="content-wrap waitlist-content">
          <h2>Want to see the data? Join the waitlist</h2>
          <p>Join the waitlist for early access.</p>
          <form class="waitlist-form" action="#" method="post">
            <label for="email" class="sr-only">Email</label>
            <input id="email" name="email" type="email" placeholder="Email *" required />

            <label for="address" class="sr-only">Address</label>
            <input id="address" name="address" type="text" placeholder="Address" />

            <label for="notes" class="sr-only">Notes</label>
            <textarea id="notes" name="notes" placeholder="Notes (optional)" rows="3"></textarea>

            <button type="submit" class="btn btn-dark">Join Waitlist</button>
          </form>
        </div>
      </section>
    </main>

    <script src="data/config.js"></script>
    <script src="data/fused-map.js"></script>
    <script src="script.js"></script>
  </body>
</html>
